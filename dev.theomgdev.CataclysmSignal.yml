id: "dev.theomgdev.CataclysmSignal"
runtime: "org.freedesktop.Platform"
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: cataclysm-tiles
finish-args: 
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

modules:
  - name: cataclysm-tiles
    buildsystem: simple
    build-options:
      env:
        MAKE_ARGS: "PREFIX=/app LANGUAGES=all USE_XDG_DIR=1 TILES=1 SOUND=1 RELEASE=1 RUNTESTS=0 ASTYLE=0 LINTJSON=0"
    build-commands:
      - sed -i "/#WARNINGS = -w/c WARNINGS = -w" Makefile
      - make -j $FLATPAK_BUILDER_N_JOBS $MAKE_ARGS
      - make $MAKE_ARGS localization
      - make $MAKE_ARGS install
      - install -Dm644 data/xdg/dev.theomgdev.CataclysmSignal.svg /app/share/icons/hicolor/scalable/apps/dev.theomgdev.CataclysmSignal.svg
      - install -Dm755 data/xdg/dev.theomgdev.CataclysmSignal.desktop /app/share/applications/dev.theomgdev.CataclysmSignal.desktop
      - install -Dm644 data/xdg/dev.theomgdev.CataclysmSignal.appdata.xml /app/share/metainfo/dev.theomgdev.CataclysmSignal.appdata.xml
    sources:
      - type: git
        url: https://github.com/theomgdev/Cataclysm-Signal.git
        commit: "3a1e04656d51c79af87b5505b1b3c37867378cce"
      - type: file
        url: https://raw.githubusercontent.com/theomgdev/Cataclysm-Signal/dedfc2e5310b505a9728098d1b59777cb8b1e861/data/xdg/dev.theomgdev.CataclysmSignal.appdata.xml
        sha256: ca7bf1a3a0598729440aaae73111ffa3992121fa19f0e36d988eee22055db29e
